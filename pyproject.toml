[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-procurement"
version = "0.1.0"
description = "Auditable supplier ingestion and EDA for Electrokomplekt"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5"]

[project.scripts]
vector-ingest = "vector_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
